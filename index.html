<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#02060a" />
  <title>Blue Whale — Extracted Particle Geometry</title>
</head>
<body>
  <main>
    <div id="scene" aria-label="Extracted blue whale particle geometry"></div>
    <aside class="controls" aria-label="Whale appearance controls">
      <label>Body <input id="bodyColor" type="color" value="#087fca"></label>
      <label>Highlights <input id="highlightColor" type="color" value="#8beeff"></label>
      <label>Belly <input id="bellyColor" type="color" value="#27cfff"></label>
      <label>Tail <input id="tailSwing" type="range" min="0" max="0.5" step="0.01" value="0.20"></label>
      <label>Glow <input id="glow" type="range" min="0" max="1.2" step="0.01" value="0.42"></label>
      <label>Particle size <input id="pointScale" type="range" min="0.5" max="2" step="0.05" value="1"></label>
    </aside>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
